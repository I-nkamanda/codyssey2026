version: '3.8'
# 컨테이너를 두 개 정의했다. (웹 서버와 캐시 데이터베이스)
services:
  web-server:
    image: nginx:latest
    ports:
      - "8080:80" # 호스트의 8080 포트를 컨테이너의 80 포트에 매핑한다. 즉, 호스트의 8080 포트로 들어오는 트래픽이 컨테이너의 80 포트로 전달된다.

    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    networks:
      - my-app-net # 웹 서버 컨테이너가 my-app-net 네트워크에 연결된다.

  cache-db: #서비스 이름이 바로 주소가 된다. 웹 서버에서 cache-db라는 이름으로 캐시 데이터베이스에 접근할 수 있다.
    image: redis:latest
    networks:
      - my-app-net # 캐시 데이터베이스 컨테이너도 my-app-net 네트워크에 연결된다.
      # 이렇게 하면 웹 서버와 캐시 데이터베이스가 같은 네트워크에 연결되어 서로 통신할 수 있다.
      # redis는 외부에 노출되는 일 없이 없이 웹 서버와 통신할 수 있다.

networks: #my-app-net이라는 이름의 네트워크를 정의했다. 이 네트워크는 브리지 드라이버를 사용한다. 

  my-app-net:
    driver: bridge # 브리지 네트워크는 컨테이너 간의 통신을 가능하게 하는 가상 네트워크 드라이버이다.